name: Android CI (Auto Build APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Choti-moti memory ya lint problems ko ignore karke force build karne ke liye
    - name: Build with Gradle (Auto-Fix Warnings & Force Build)
      run: ./gradlew assembleDebug -x lint -x test --stacktrace

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: My-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
